<!DOCTYPE html>
<html>

<head>

<title>Application Form</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');

body{
margin:0;
background:#00843d;
font-family:'Comic Neue', Arial;
color:#075c2b;
}


.top{
background:white;
padding:20px;
display:flex;
justify-content:space-between;
font-size:25px;
}


.back{
background:white;
padding:25px;
font-size:20px;
}



.container{

background:white;
margin:30px 20px;
padding:30px;
border-radius:35px;

}



h2{

font-size:30px;

}



input, select{

width:100%;
padding:22px;
margin-top:20px;
border:none;
background:#f2f8f3;
border-radius:20px;
font-size:18px;
box-sizing:border-box;

}



label{

display:block;
margin-top:25px;
font-size:18px;

}



.features{

display:flex;
justify-content:space-around;
text-align:center;
margin-top:40px;

}



.circle{

background:#e5f5e8;
width:60px;
height:60px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
margin:auto;

}



button{

width:100%;
margin-top:35px;
padding:20px;
border:none;
border-radius:35px;
background:#00a651;
color:white;
font-size:20px;

}


</style>

</head>


<body>


<div class="top">

<div>
KCB M-PESA Loans
</div>

<div>
Help ?
</div>

</div>



<a href="index.html" style="text-decoration:none; color:#075c2b;">

<div class="back">

← Back

</div>

</a>




<div class="container">


<h2>
Application Information
</h2>



<label>
Full Name
</label>

<input type="text" placeholder="Full Name">



<label>
Phone Number
</label>

<input type="tel" placeholder="Phone Number">



<label>
National ID Number
</label>

<input type="number" placeholder="National ID Number">



<label>
Select Loan Type
</label>


<select>

<option>
Choose loan purpose
</option>

<option>
Business
</option>

<option>
Education
</option>

<option>
Emergency
</option>

<option>
Personal Use
</option>

</select>




<div class="features">


<div>

<div class="circle">
🔒
</div>

<p>
Secure
</p>

</div>


<div>

<div class="circle">
🛡
</div>

<p>
Trusted
</p>

</div>


<div>

<div class="circle">
✓
</div>

<p>
Verified
</p>

</div>




<a href="loan.html" style="text-decoration:none;">

<button>
SELECT
</button>

</a>

</html>
