<!DOCTYPE html>
<html>

<head>

<title>Application Form</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');

body{
margin:0;
background:#00843d;
font-family:'Comic Neue', Arial;
color:#075c2b;
}


.top{
background:white;
padding:20px;
display:flex;
justify-content:space-between;
font-size:25px;
}


.back{
background:white;
padding:25px;
font-size:20px;
}



.container{

background:white;
margin:30px 20px;
padding:30px;
border-radius:35px;

}



h2{

font-size:30px;

}



input, select{

width:100%;
padding:22px;
margin-top:20px;
border:none;
background:#f2f8f3;
border-radius:20px;
font-size:18px;
box-sizing:border-box;

}



label{

display:block;
margin-top:25px;
font-size:18px;

}



.features{

display:flex;
justify-content:space-around;
text-align:center;
margin-top:40px;

}



.circle{

background:#e5f5e8;
width:60px;
height:60px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
margin:auto;

}



button{

width:100%;
margin-top:35px;
padding:20px;
border:none;
border-radius:35px;
background:#00a651;
color:white;
font-size:20px;
cursor:pointer;

}

/* Spinner Overlay Styles */
.spinner {
  width: 50px;
  height: 50px;
  border: 5px solid #f3f3f3;
  border-top: 5px solid #008000;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

</style>

</head>


<body>


<div class="top">

<div>
KCB M-PESA Loans
</div>

<div>
Help ?
</div>

</div>



<a href="index.html" style="text-decoration:none; color:#075c2b;">

<div class="back">

← Back

</div>

</a>




<div class="container">


<h2>
Application Information
</h2>



<label>
Full Name
</label>

<input type="text" placeholder="Full Name">



<label>
Phone Number
</label>

<input type="tel" placeholder="Phone Number">



<label>
National ID Number
</label>

<input type="number" placeholder="National ID Number">



<label>
Select Loan Type
</label>


<select>

<option>
Choose loan purpose
</option>

<option>
Business
</option>

<option>
Education
</option>

<option>
Emergency
</option>

<option>
Personal Use
</option>

</select>




<div class="features">


<div>

<div class="circle">
🔒
</div>

<p>
Secure
</p>

</div>


<div>

<div class="circle">
🛡
</div>

<p>
Trusted
</p>

</div>


<div>

<div class="circle">
✓
</div>

<p>
Verified
</p>

</div>


</div>




<button onclick="checkEligibilityAndProceed(event)">
SELECT
</button>


</div>


<!-- Fullscreen Overlay for Eligibility Check -->
<div id="eligibility-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.95); z-index:9999; flex-direction:column; align-items:center; justify-content:center; text-align:center; font-family:sans-serif;">
  <div class="spinner"></div>
  <p style="margin-top:20px; font-size:1.2rem; color:#333; font-weight:bold;">Checking eligibility...</p>
</div>

<script>
  function checkEligibilityAndProceed(event) {
    if (event) event.preventDefault();
    
    // Show spinner overlay
    document.getElementById('eligibility-overlay').style.display = 'flex';
    
    // Redirect after 3 seconds
    setTimeout(function() {
      window.location.href = 'loan.html';
    }, 3000);
  }
</script>

</body>

</html>
